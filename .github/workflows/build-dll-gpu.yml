name: Build OCR C API shared lib (GPU Vulkan)

on:
  workflow_dispatch:
  push:
    branches: [ build-dll-gpu ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            lib: ocr_capi.dll
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            lib: libocr_capi.so
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libocr_capi.dylib

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress

      - name: "Static CRT (Windows - self-contained dll)"
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Build cdylib (GPU Vulkan)
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --features vulkan

      - name: Collect shared lib
        shell: bash
        run: |
          mkdir -p upload
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "upload/ocr_capi_gpu_${{ matrix.lib }}" 2>/dev/null || \
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" upload/ || true
          cp include/ocr_capi.h upload/ || true
          ls -la upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-gpu-${{ matrix.target }}
          path: upload/*
          retention-days: 30
